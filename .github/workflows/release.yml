name: Build and publish factory image

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Build even when this commit and upstream rootfs were already released
        required: false
        type: boolean
        default: false
      smoke_source_run_id:
        description: Smoke-test the factory image artifact from this prior run ID instead of building
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - build.py
      - guest/**
      - overlay/**
      - templates/**
      - ci/**
      - install-deps.sh
      - .github/workflows/release.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: archlinuxarm-oci-release
  cancel-in-progress: false

jobs:
  decide:
    if: inputs.smoke_source_run_id == ''
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      reason: ${{ steps.decision.outputs.reason }}
      rootfs_url: ${{ steps.decision.outputs.rootfs_url }}
      upstream_md5: ${{ steps.decision.outputs.upstream_md5 }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether an image build is needed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Manual releases may only be dispatched from main." >&2
            exit 1
          fi

          rootfs_url="$(python3 -c 'import build; print(build.DEFAULT_ROOTFS_URL)')"
          checksum="$(curl -fsSL --retry 3 "${rootfs_url}.md5" | awk 'NR == 1 {print tolower($1)}')"
          if [[ ! "$checksum" =~ ^[0-9a-f]{32}$ ]]; then
            echo "Invalid upstream MD5 response for ${rootfs_url}.md5" >&2
            exit 1
          fi

          latest_sha=""
          latest_md5=""
          latest_tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -n "$latest_tag" ]]; then
            mkdir -p "$RUNNER_TEMP/latest-release"
            if gh release download "$latest_tag" --pattern build-info.json \
                 --dir "$RUNNER_TEMP/latest-release" >/dev/null 2>&1; then
              parsed="$(python3 - "$RUNNER_TEMP/latest-release/build-info.json" <<'PY' || true
          import json
          import re
          import sys

          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
              sha = data["git_sha"]
              md5 = data["upstream_md5"].lower()
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise ValueError("invalid git SHA")
              if not re.fullmatch(r"[0-9a-f]{32}", md5):
                  raise ValueError("invalid MD5")
              print(sha, md5)
          except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError):
              pass
          PY
              )"
              if [[ -n "$parsed" ]]; then
                read -r latest_sha latest_md5 <<<"$parsed"
              fi
            fi
          fi

          should_build=false
          reason=already-released
          if [[ "$FORCE_REBUILD" == true ]]; then
            should_build=true
            reason=manual-force
          elif [[ -z "$latest_sha" || -z "$latest_md5" ]]; then
            should_build=true
            reason=no-valid-previous-release
          elif [[ "$GITHUB_EVENT_NAME" == schedule && "$checksum" != "$latest_md5" ]]; then
            should_build=true
            reason=upstream-rootfs-changed
          elif [[ "$GITHUB_EVENT_NAME" != schedule && \
                  ("$GITHUB_SHA" != "$latest_sha" || "$checksum" != "$latest_md5") ]]; then
            should_build=true
            reason=project-or-upstream-changed
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "rootfs_url=$rootfs_url" >> "$GITHUB_OUTPUT"
          echo "upstream_md5=$checksum" >> "$GITHUB_OUTPUT"
          echo "Decision: should_build=$should_build reason=$reason"

  build:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      build_date: ${{ steps.names.outputs.build_date }}
      image_name: ${{ steps.names.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Run source checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile build.py
          bash -n ci/*.sh guest/*.sh install-deps.sh

      - name: Install build dependencies
        run: ./install-deps.sh

      - name: Configure libguestfs appliance
        run: ./ci/prepare-libguestfs.sh

      - name: Check build environment
        run: ./build.py --check

      - name: Prepare release names
        id: names
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_MD5: ${{ needs.decide.outputs.upstream_md5 }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y.%m.%d)"
          short_sha="${GITHUB_SHA:0:7}"
          md5_prefix="${UPSTREAM_MD5:0:8}"
          tag="${build_date}-${short_sha}-${md5_prefix}"
          if [[ "$FORCE_REBUILD" == true ]] && gh release view "$tag" >/dev/null 2>&1; then
            tag="${tag}-run${GITHUB_RUN_ID}"
          fi
          work_dir="/tmp/archlinuxarm-oci-work"
          image_name="archlinuxarm-oci-aarch64-${tag}.qcow2"
          image="$work_dir/$image_name"
          mkdir -p "$work_dir"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Report workspace storage
        run: |
          findmnt -T /tmp
          findmnt -T "$RUNNER_TEMP"
          df -hT /tmp "$RUNNER_TEMP"

      - name: Build and validate factory raw image
        run: |
          ./build.py \
            --factory-image \
            --work-dir /tmp/archlinuxarm-oci-work \
            --rootfs-url "${{ needs.decide.outputs.rootfs_url }}" \
            --build-only

      - name: Convert factory image to compressed QCOW2
        run: |
          ./build.py \
            --work-dir /tmp/archlinuxarm-oci-work \
            --convert-only \
            --output "${{ steps.names.outputs.image }}"

      - name: Generate artifact checksum
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          set -euo pipefail
          image_name="$(basename "$IMAGE")"
          (cd "$(dirname "$IMAGE")" && sha256sum "$image_name" > "$image_name.sha256")

      - name: Upload converted image for smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: factory-image-${{ github.run_id }}
          compression-level: 0
          retention-days: 7
          path: |
            ${{ steps.names.outputs.image }}
            ${{ steps.names.outputs.image }}.sha256
            /tmp/archlinuxarm-oci-work/build-state.json

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-build-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/archlinuxarm-oci-work/build-serial.log
            /tmp/archlinuxarm-oci-work/build-state.json

  smoke:
    needs: [decide, build]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install smoke-test dependencies
        run: ./install-deps.sh

      - name: Configure libguestfs appliance
        run: ./ci/prepare-libguestfs.sh

      - name: Download converted image artifact
        uses: actions/download-artifact@v4
        with:
          name: factory-image-${{ github.run_id }}
          path: /tmp/archlinuxarm-oci-smoke

      - name: Smoke-test downloaded QCOW2 artifact
        run: |
          ./build.py \
            --work-dir /tmp/archlinuxarm-oci-smoke \
            --smoke-test-only

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-smoke-results-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/archlinuxarm-oci-smoke/build-state.json
            /tmp/archlinuxarm-oci-smoke/uefi-smoke-serial.log

  publish:
    needs: [decide, build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download tested image artifact
        uses: actions/download-artifact@v4
        with:
          name: factory-image-${{ github.run_id }}
          path: /tmp/archlinuxarm-oci-release

      - name: Download smoke result
        uses: actions/download-artifact@v4
        with:
          name: factory-smoke-results-${{ github.run_id }}
          path: /tmp/archlinuxarm-oci-smoke-result

      - name: Generate release metadata
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image_name }}
          BUILD_DATE: ${{ needs.build.outputs.build_date }}
          UPSTREAM_ROOTFS_URL: ${{ needs.decide.outputs.rootfs_url }}
          UPSTREAM_MD5: ${{ needs.decide.outputs.upstream_md5 }}
        run: |
          set -euo pipefail
          release_dir=/tmp/archlinuxarm-oci-release
          image="$release_dir/$IMAGE_NAME"
          image_sha256="$(awk '{print $1}' "$image.sha256")"
          actual_sha256="$(sha256sum "$image" | awk '{print $1}')"
          if [[ "$image_sha256" != "$actual_sha256" ]]; then
            echo "Downloaded release image checksum mismatch." >&2
            exit 1
          fi
          export IMAGE_SHA256="$image_sha256"
          python3 - /tmp/archlinuxarm-oci-smoke-result/build-state.json \
            "$release_dir/build-info.json" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          import build

          state = json.load(open(sys.argv[1], encoding="utf-8"))
          if state.get("smoke_passed") is not True or state.get("stage") != "smoke-passed":
              raise SystemExit("downloaded artifact has no successful smoke-test result")
          info = {
              "schema_version": 1,
              "build_date_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "git_sha": os.environ["GITHUB_SHA"],
              "git_short_sha": os.environ["GITHUB_SHA"][:7],
              "build_mode": "factory",
              "factory_user": "alarm",
              "upstream_rootfs_url": os.environ["UPSTREAM_ROOTFS_URL"],
              "upstream_md5": os.environ["UPSTREAM_MD5"],
              "rootfs_signing_fingerprint": build.ROOTFS_SIGNING_FINGERPRINT,
              "image_filename": os.environ["IMAGE_NAME"],
              "image_sha256": os.environ["IMAGE_SHA256"],
              "build_accel": state.get("build_accel"),
              "smoke_accel": state.get("smoke_accel"),
          }
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              json.dump(info, output, indent=2, sort_keys=True)
              output.write("\n")
          PY
          cat > "$release_dir/release-notes.md" <<EOF
          Community-built Arch Linux ARM OCI factory image.

          - Project commit: \`${GITHUB_SHA}\`
          - Upstream rootfs MD5: \`${UPSTREAM_MD5}\`
          - Factory login: \`alarm\` with the SSH key supplied at OCI launch

          The upstream rootfs was authenticated with its detached OpenPGP signature; MD5 is used only for change detection.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ needs.build.outputs.image_name }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          release_dir=/tmp/archlinuxarm-oci-release
          image="$release_dir/$IMAGE_NAME"
          gh release create "$TAG" \
            "$image" \
            "$image.sha256" \
            "$release_dir/build-info.json" \
            --title "Arch Linux ARM OCI Image — ${{ needs.build.outputs.build_date }}" \
            --notes-file "$release_dir/release-notes.md"

  smoke-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_source_run_id != ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install smoke-test dependencies
        run: ./install-deps.sh

      - name: Configure libguestfs appliance
        run: ./ci/prepare-libguestfs.sh

      - name: Download image artifact from prior run
        uses: actions/download-artifact@v4
        with:
          name: factory-image-${{ inputs.smoke_source_run_id }}
          path: /tmp/archlinuxarm-oci-smoke
          github-token: ${{ github.token }}
          run-id: ${{ inputs.smoke_source_run_id }}

      - name: Smoke-test existing QCOW2 artifact
        run: |
          ./build.py \
            --work-dir /tmp/archlinuxarm-oci-smoke \
            --smoke-test-only

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-smoke-retest-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/archlinuxarm-oci-smoke/build-state.json
            /tmp/archlinuxarm-oci-smoke/uefi-smoke-serial.log
