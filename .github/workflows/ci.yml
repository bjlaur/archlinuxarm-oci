name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run downloader tests
        run: python3 tests/excluded_test_download_latest.py -v

      - name: Check Python syntax
        run: python3 -m py_compile build.py deploy-oci.py download-latest.py

      - name: Check shell syntax
        run: bash -n ci/*.sh guest/*.sh install-deps.sh
