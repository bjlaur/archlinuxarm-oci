set default=0
set timeout=0
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

menuentry 'Arch Linux ARM UEFI smoke test' {
    search --no-floppy --fs-uuid --set=root {{ROOT_UUID}}
    linux /boot/Image root=UUID={{ROOT_UUID}} rw rootwait console=ttyAMA0,115200n8 systemd.unit=oci-image-smoke.service systemd.show_status=yes
    initrd /boot/initramfs-linux.img
}

