# nftables backend; SSHGuard owns its dynamic blocking tables.
BACKEND="/usr/lib/sshguard/sshg-fw-nft-sets"

# Follow authentication-related journal entries continuously.
LOGREADER="LANG=C.UTF-8 /usr/bin/journalctl -afb -p info -n1 -t sshd-session -t sshd -o cat"

THRESHOLD=20
BLOCK_TIME=180
DETECTION_TIME=3600
BLACKLIST_FILE=100:/var/db/sshguard/blacklist.db
